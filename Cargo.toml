[workspace]
members = [
    "crates/nova-protocol",
    "crates/nova-core",
    "crates/nova-client",
    "crates/nova-cli",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nova Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.23.0", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
thiserror = "2"
anyhow = "1.0.102"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
