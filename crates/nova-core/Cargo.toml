[package]
name = "nova-core"
version = "0.1.0"
edition = "2021"
description = "Nova Agent 内核：引擎、工具、权限、会话、Provider 适配（无桌面依赖）"
publish = false

[dependencies]
nova-protocol = { path = "../nova-protocol" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

async-trait = "0.1"
toml = "0.8"
jsonschema = { version = "0.46.5", default-features = false }
ignore = "0.4"
glob = "0.3"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
regex = "1"
similar = "2.7"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3.32"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "macros"] }
sha2 = "0.10"
image = "0.24"
base64 = "0.22.1"
lopdf = "0.34"
aes-gcm = "0.10"
rand = "0.8"
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2"
croner = "3.0.1"
tiktoken-rs = "0.12.0"
once_cell = "1.21.4"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-bash = "0.23"
libc = "0.2"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.10"
